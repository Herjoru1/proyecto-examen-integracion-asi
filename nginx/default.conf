server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name proyecto.final.asi;

    ssl_certificate /etc/nginx/tls/servidor.crt;
    ssl_certificate_key /etc/nginx/tls/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ASI:1m;
    server_tokens off;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /estilos.css {
        root /srv/estaticos;
    }

    location = /favicon.ico {
        return 204;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend app:3000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
