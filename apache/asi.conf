ServerName proyecto.final.asi
ServerTokens Prod
ServerSignature Off
StrictHostCheck On
SSLSessionCache "shmcb:/usr/local/apache2/logs/asi_tls(524288)"

<VirtualHost *:443>
    ServerName proyecto.final.asi

    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "/usr/local/apache2/conf/tls/servidor.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/tls/servidor.key"

    LimitRequestBody 4096
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "/estilos.css" "!"
    ProxyPass "/favicon.ico" "!"
    RedirectMatch 204 "^/favicon[.]ico$"
    ProxyPass "/" "http://app:3000/" disablereuse=On
    ProxyPassReverse "/" "http://app:3000/"
</VirtualHost>
